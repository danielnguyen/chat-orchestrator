name: Evidence acquisition composed smoke

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/composed-smoke.yml]

permissions:
  contents: read

jobs:
  composed-smoke:
    # Evidence-only diagnostic for #225. Never merge this workflow.
    if: >-
      github.event.pull_request.number == 232 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == 'danielnguyen/chat-orchestrator' &&
      github.head_ref == 'openhands/issue-231'
    name: actual-service-evidence-acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Chat Orchestrator
        uses: actions/checkout@v4
        with:
          ref: a79c65575e1f3c053f7aeaa08850c344ff111c76
          path: chat-orchestrator
          fetch-depth: 0

      - name: Checkout Cognitive Runtime
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/cognitive-runtime
          ref: f3871f5f9db1b859143669fbc0d7de4cfe310148
          path: cognitive-runtime
          fetch-depth: 0

      - name: Checkout Data Source Aggregator
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/data-source-aggregator
          ref: 57389cab54481d1c768d403fb9213cc2748103d3
          path: data-source-aggregator
          fetch-depth: 0

      - name: Checkout Basic Memory Store
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/basic-memory-store
          ref: f56e18c107b95074e3261c13b99fe3020178bd80
          path: basic-memory-store
          fetch-depth: 0

      - name: Establish checked-out local main refs
        run: |
          cr="$(git -C cognitive-runtime rev-parse HEAD)"
          dsa="$(git -C data-source-aggregator rev-parse HEAD)"
          bms="$(git -C basic-memory-store rev-parse HEAD)"
          git -C cognitive-runtime switch --detach "$cr"
          git -C data-source-aggregator switch --detach "$dsa"
          git -C basic-memory-store switch --detach "$bms"
          git -C cognitive-runtime branch --force main "$cr"
          git -C data-source-aggregator branch --force main "$dsa"
          git -C basic-memory-store branch --force main "$bms"
          git -C chat-orchestrator merge-base --is-ancestor 22c327966c32da733391e5490b8d422ebbee9288 HEAD

      - name: Checkout G2 gateway
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all' || inputs.evidence_scenario == 'g2-deferred'
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/g2-gateway
          ref: 56f2e55d240ba539aa938a994c1be64d8fde275f
          path: g2-gateway
          fetch-depth: 0

      - name: Compare last qualified pair on this runner
        working-directory: chat-orchestrator
        env:
          TRANSPORT_LATENCY_ONLY: "1"
          COMPOSED_LATENCY_POLICY: report
          COMPOSED_SMOKE_LOG_DIR: /tmp/ccp-225-matched-baseline
        run: |
          verify_ref() {
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            test -z "$(git -C "$1" status --porcelain)"
          }
          verify_ref . a79c65575e1f3c053f7aeaa08850c344ff111c76
          verify_ref ../cognitive-runtime f3871f5f9db1b859143669fbc0d7de4cfe310148
          verify_ref ../basic-memory-store f56e18c107b95074e3261c13b99fe3020178bd80
          verify_ref ../data-source-aggregator 57389cab54481d1c768d403fb9213cc2748103d3
          verify_ref ../g2-gateway 56f2e55d240ba539aa938a994c1be64d8fde275f
          git switch --detach 7d0b9919b95c602edb71c9ecf2f764ae9ca6fded
          git -C ../cognitive-runtime switch --detach cf0c83d089651911930e5357176932a1cca0fdaa
          git -C ../cognitive-runtime branch --force main cf0c83d089651911930e5357176932a1cca0fdaa
          verify_ref . 7d0b9919b95c602edb71c9ecf2f764ae9ca6fded
          verify_ref ../cognitive-runtime cf0c83d089651911930e5357176932a1cca0fdaa
          printf 'Matched baseline CO=%s CR=%s\n' 7d0b9919b95c602edb71c9ecf2f764ae9ca6fded cf0c83d089651911930e5357176932a1cca0fdaa >> "$GITHUB_STEP_SUMMARY"
          nproc
          cat /proc/pressure/cpu
          make composed-smoke
          cat /proc/pressure/cpu
          git switch --detach a79c65575e1f3c053f7aeaa08850c344ff111c76
          git -C ../cognitive-runtime switch --detach f3871f5f9db1b859143669fbc0d7de4cfe310148
          git -C ../cognitive-runtime branch --force main f3871f5f9db1b859143669fbc0d7de4cfe310148
          verify_ref . a79c65575e1f3c053f7aeaa08850c344ff111c76
          verify_ref ../cognitive-runtime f3871f5f9db1b859143669fbc0d7de4cfe310148

      - name: Validate Compose configuration
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_TMP: /tmp/chat-orchestrator-composed-config
        run: docker compose -f docker-compose.composed-smoke.yml config >/dev/null

      - name: Build Chat Orchestrator image
        working-directory: chat-orchestrator
        run: docker build -f api/Dockerfile -t chat-orchestrator:history-root-lineage-v2-test api

      - name: Run Chat Orchestrator tests
        working-directory: chat-orchestrator
        run: >-
          docker run --rm
          --mount type=bind,source="$PWD/scripts",target=/scripts,readonly
          chat-orchestrator:history-root-lineage-v2-test python -m pytest -q

      - name: Run focused actual-service evidence proof
        id: focused_evidence
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario != 'g2-deferred'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          EVIDENCE_ACQUISITION_ONLY: "1"
          EVIDENCE_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_scenario || 'all' }}
          COMPOSED_LATENCY_POLICY: report
        run: |
          # Clear only this invocation's latency evidence, including on early functional failure.
          rm -f "$COMPOSED_SMOKE_LOG_DIR/latency-regression.json" \
            "$COMPOSED_SMOKE_LOG_DIR/latency-samples.jsonl"
          make composed-smoke

      - name: Run formatted presentation persistence proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario != 'g2-deferred'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          EVIDENCE_ACQUISITION_ONLY: "1"
          EVIDENCE_SCENARIO: general-reasoning-presentation
          COMPOSED_GENERAL_EVIDENCE_REASONING_ENABLED: "true"
          COMPOSED_GENERAL_EVIDENCE_REASONING_PRESENTATION_ENABLED: "true"
        run: make composed-smoke

      - name: Run G2 deferred result proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all' || inputs.evidence_scenario == 'g2-deferred'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          G2_DEFERRED_ONLY: "1"
        run: make composed-smoke

      - name: Run policy-admitted advisory evidence proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          EVIDENCE_ADVISORY_ONLY: "1"
        run: make composed-smoke

      - name: Run server-owned immediate-history proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          HISTORY_FOLLOWUP_ONLY: "1"
        run: make composed-smoke

      - name: Run distinct-client owner-memory proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          DISTINCT_CLIENT_MEMORY_ONLY: "1"
        run: make composed-smoke

      - name: Run runtime admission composition proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          RUNTIME_ADMISSION_COMPOSITION_ONLY: "1"
        run: make composed-smoke

      - name: Run omitted conversation continuation proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          OMITTED_CONTINUATION_ONLY: "1"
        run: make composed-smoke

      - name: Run situated presence composition proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          SITUATED_PRESENCE_ONLY: "1"
          COMPOSED_RESTRAINT_ENABLED: "true"
        run: make composed-smoke

      - name: Run conversation retirement composition proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          RETIREMENT_ONLY: "1"
        run: make composed-smoke

      - name: Run complete composed smoke regression
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
        run: make composed-smoke

      - name: Record tested composition with explicit performance status
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        env:
          LATENCY_STATUS: ${{ steps.focused_evidence.outputs.latency_status }}
        run: |
          co="$(git -C chat-orchestrator rev-parse HEAD)"
          cr="$(git -C cognitive-runtime rev-parse HEAD)"
          bms="$(git -C basic-memory-store rev-parse HEAD)"
          dsa="$(git -C data-source-aggregator rev-parse HEAD)"
          case "$LATENCY_STATUS" in
            pass)
              composition="CCP_TESTED_COMPOSITION co=$co cr=$cr bms=$bms dsa=$dsa"
              heading="Tested CCP composition — functional and latency checks passed"
              ;;
            fail)
              composition="CCP_FUNCTIONAL_TESTED_COMPOSITION co=$co cr=$cr bms=$bms dsa=$dsa latency=FAIL performance_acceptance=false"
              heading="Functionally tested CCP composition — latency FAIL (NONBLOCKING); performance NOT accepted"
              ;;
            *) echo "Missing validated latency status; composition not recorded" >&2; exit 1 ;;
          esac
          printf '%s\n' "$composition"
          printf '## %s\n\n`%s`\n' "$heading" "$composition" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded failure and latency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-composed-smoke-diagnostics
          path: |
            /tmp/chat-orchestrator-bounded-logs
            /tmp/ccp-225-matched-baseline
          if-no-files-found: ignore
          retention-days: 3
