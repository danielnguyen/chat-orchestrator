name: Evidence acquisition composed smoke

on:
  workflow_dispatch:
    inputs:
      evidence_scenario:
        description: Evidence scenario to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - aggregate
          - history-hybrid
          - history-exhaustive
          - history-unknown
          - history-negatives
          - compound
          - adversarial-provider
          - scope-references
          - structured-answer-recovery
          - source-scope
          - g2-deferred
  pull_request:
    branches:
      - main
    paths:
      - api/**
      - docker-compose.composed-smoke.yml
      - scripts/composed_smoke.sh
      - scripts/evidence_acquisition_composed.sh
      - api/tools/composed_provider_stub.py
      - api/tools/composed_source_fixture.py
      - docs/validation.md
      - .github/workflows/composed-smoke.yml
  push:
    branches:
      - main
    paths:
      - api/**
      - docker-compose.composed-smoke.yml
      - scripts/composed_smoke.sh
      - scripts/evidence_acquisition_composed.sh
      - api/tools/composed_provider_stub.py
      - api/tools/composed_source_fixture.py
      - docs/validation.md
      - .github/workflows/composed-smoke.yml

permissions:
  contents: read

jobs:
  composed-smoke:
    # Evidence-only draft for #231. Never merge this workflow revision.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == true &&
       github.event.pull_request.head.repo.full_name == 'danielnguyen/chat-orchestrator' &&
       github.head_ref == 'openhands/issue-231') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/openhands/issue-231')
    name: actual-service-evidence-acquisition (${{ matrix.composition }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - composition: candidate-pair
            co: 5f75599d41d11f484963cfe8c65a0d6c783f01d6
          - composition: legacy-sender
            co: 16972decccf7221707820c158dcb0e540e6411e6
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Chat Orchestrator
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.co }}
          path: chat-orchestrator
          fetch-depth: 0

      - name: Checkout Cognitive Runtime
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/cognitive-runtime
          ref: 4626dc1c55b0e5c34e8916d1baff44d683c85b2a
          path: cognitive-runtime
          fetch-depth: 0

      - name: Checkout Data Source Aggregator
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/data-source-aggregator
          ref: 57389cab54481d1c768d403fb9213cc2748103d3
          path: data-source-aggregator
          fetch-depth: 0

      - name: Checkout Basic Memory Store
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/basic-memory-store
          ref: f56e18c107b95074e3261c13b99fe3020178bd80
          path: basic-memory-store
          fetch-depth: 0

      - name: Establish checked-out local main refs
        run: |
          cr="$(git -C cognitive-runtime rev-parse HEAD)"
          dsa="$(git -C data-source-aggregator rev-parse HEAD)"
          bms="$(git -C basic-memory-store rev-parse HEAD)"
          git -C cognitive-runtime switch --detach "$cr"
          git -C data-source-aggregator switch --detach "$dsa"
          git -C basic-memory-store switch --detach "$bms"
          git -C cognitive-runtime branch --force main "$cr"
          git -C data-source-aggregator branch --force main "$dsa"
          git -C basic-memory-store branch --force main "$bms"
          git -C chat-orchestrator merge-base --is-ancestor 22c327966c32da733391e5490b8d422ebbee9288 HEAD

      - name: Checkout G2 gateway
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all' || inputs.evidence_scenario == 'g2-deferred'
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/g2-gateway
          ref: 56f2e55d240ba539aa938a994c1be64d8fde275f
          path: g2-gateway
          fetch-depth: 0

      - name: Verify exact service revisions and candidate ancestry
        id: revisions
        env:
          EXPECTED_CO: ${{ matrix.co }}
        run: |
          verify() {
            actual="$(git -C "$1" rev-parse HEAD)"
            test "$actual" = "$2"
            test -z "$(git -C "$1" status --porcelain)"
            printf '%s %s\n' "$1" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          verify chat-orchestrator "$EXPECTED_CO"
          verify cognitive-runtime 4626dc1c55b0e5c34e8916d1baff44d683c85b2a
          verify data-source-aggregator 57389cab54481d1c768d403fb9213cc2748103d3
          verify basic-memory-store f56e18c107b95074e3261c13b99fe3020178bd80
          if [ -d g2-gateway ]; then
            verify g2-gateway 56f2e55d240ba539aa938a994c1be64d8fde275f
          fi
          git -C chat-orchestrator merge-base --is-ancestor 16972decccf7221707820c158dcb0e540e6411e6 HEAD
          git -C cognitive-runtime merge-base --is-ancestor 01bbfa72a946fe82a86c0e5148dd21e0aaa8ba71 HEAD

      - name: Validate Compose configuration
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_TMP: /tmp/chat-orchestrator-composed-config
        run: docker compose -f docker-compose.composed-smoke.yml config >/dev/null

      - name: Build Chat Orchestrator image
        working-directory: chat-orchestrator
        run: docker build -f api/Dockerfile -t chat-orchestrator:history-root-lineage-v2-test api

      - name: Run Chat Orchestrator tests
        id: unit_tests
        working-directory: chat-orchestrator
        run: >-
          docker run --rm
          --mount type=bind,source="$PWD/scripts",target=/scripts,readonly
          chat-orchestrator:history-root-lineage-v2-test python -m pytest -q

      - name: Run source-scope actual-service evidence proof
        id: source_scope
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-source-scope-logs
          EVIDENCE_ACQUISITION_ONLY: "1"
          EVIDENCE_SCENARIO: source-scope
        run: make composed-smoke

      - name: Run focused actual-service evidence proof
        id: focused_evidence
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario != 'g2-deferred') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          EVIDENCE_ACQUISITION_ONLY: "1"
          EVIDENCE_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_scenario || 'all' }}
          COMPOSED_LATENCY_POLICY: report
        run: |
          # Clear only this invocation's latency evidence, including on early functional failure.
          rm -f "$COMPOSED_SMOKE_LOG_DIR/latency-regression.json" \
            "$COMPOSED_SMOKE_LOG_DIR/latency-samples.jsonl"
          make composed-smoke

      - name: Run formatted presentation persistence proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario != 'g2-deferred') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-1
          EVIDENCE_ACQUISITION_ONLY: "1"
          EVIDENCE_SCENARIO: general-reasoning-presentation
          COMPOSED_GENERAL_EVIDENCE_REASONING_ENABLED: "true"
          COMPOSED_GENERAL_EVIDENCE_REASONING_PRESENTATION_ENABLED: "true"
        run: make composed-smoke

      - name: Run G2 deferred result proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all' || inputs.evidence_scenario == 'g2-deferred') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-2
          G2_DEFERRED_ONLY: "1"
        run: make composed-smoke

      - name: Run policy-admitted advisory evidence proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-3
          EVIDENCE_ADVISORY_ONLY: "1"
        run: make composed-smoke

      - name: Run server-owned immediate-history proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-4
          HISTORY_FOLLOWUP_ONLY: "1"
        run: make composed-smoke

      - name: Run distinct-client owner-memory proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-5
          DISTINCT_CLIENT_MEMORY_ONLY: "1"
        run: make composed-smoke

      - name: Run runtime admission composition proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-6
          RUNTIME_ADMISSION_COMPOSITION_ONLY: "1"
        run: make composed-smoke

      - name: Run omitted conversation continuation proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-7
          OMITTED_CONTINUATION_ONLY: "1"
        run: make composed-smoke

      - name: Run situated presence composition proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-8
          SITUATED_PRESENCE_ONLY: "1"
          COMPOSED_RESTRAINT_ENABLED: "true"
        run: make composed-smoke

      - name: Run conversation retirement composition proof
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-9
          RETIREMENT_ONLY: "1"
        run: make composed-smoke

      - name: Run complete composed smoke regression
        id: regression
        if: ${{ !cancelled() && steps.unit_tests.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all') }}
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs/proof-10
        run: make composed-smoke

      - name: Record tested composition with explicit performance status
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        env:
          LATENCY_STATUS: ${{ steps.focused_evidence.outputs.latency_status }}
        run: |
          co="$(git -C chat-orchestrator rev-parse HEAD)"
          cr="$(git -C cognitive-runtime rev-parse HEAD)"
          bms="$(git -C basic-memory-store rev-parse HEAD)"
          dsa="$(git -C data-source-aggregator rev-parse HEAD)"
          case "$LATENCY_STATUS" in
            pass)
              composition="CCP_TESTED_COMPOSITION co=$co cr=$cr bms=$bms dsa=$dsa"
              heading="Tested CCP composition — functional and latency checks passed"
              ;;
            fail)
              composition="CCP_FUNCTIONAL_TESTED_COMPOSITION co=$co cr=$cr bms=$bms dsa=$dsa latency=FAIL performance_acceptance=false"
              heading="Functionally tested CCP composition — latency FAIL (NONBLOCKING); performance NOT accepted"
              ;;
            *) echo "Missing validated latency status; composition not recorded" >&2; exit 1 ;;
          esac
          printf '%s\n' "$composition"
          printf '## %s\n\n`%s`\n' "$heading" "$composition" >> "$GITHUB_STEP_SUMMARY"

      - name: Record validation disposition
        if: always()
        env:
          SOURCE_SCOPE: ${{ steps.source_scope.outcome }}
          FOCUSED: ${{ steps.focused_evidence.outcome }}
          LATENCY_STATUS: ${{ steps.focused_evidence.outputs.latency_status }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          printf 'Complete regression: %s\n' "$REGRESSION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Source scope: %s; focused: %s; latency: %s\n' \
            "$SOURCE_SCOPE" "$FOCUSED" "${LATENCY_STATUS:-UNKNOWN}" >> "$GITHUB_STEP_SUMMARY"
          printf 'Deterministic fixtures only; model-backed and Telegram acceptance not executed.\n' >> "$GITHUB_STEP_SUMMARY"
          docker image inspect chat-orchestrator:history-root-lineage-v2-test \
            --format 'CO test image: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded failure and latency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-composed-smoke-diagnostics-${{ matrix.composition }}
          path: |
            /tmp/chat-orchestrator-bounded-logs
            /tmp/chat-orchestrator-source-scope-logs
          if-no-files-found: ignore
          retention-days: 3
