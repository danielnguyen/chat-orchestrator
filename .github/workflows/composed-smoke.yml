name: Evidence acquisition composed smoke

on:
  workflow_dispatch:
    inputs:
      evidence_scenario:
        description: Evidence scenario to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - aggregate
          - history-hybrid
          - history-exhaustive
          - history-unknown
          - history-negatives
          - compound
          - adversarial-provider
          - scope-references
          - structured-answer-recovery
          - source-scope
  pull_request:
    branches:
      - main
    paths:
      - api/**
      - docker-compose.composed-smoke.yml
      - scripts/composed_smoke.sh
      - scripts/evidence_acquisition_composed.sh
      - api/tools/composed_provider_stub.py
      - api/tools/composed_source_fixture.py
      - docs/validation.md
      - .github/workflows/composed-smoke.yml

permissions:
  contents: read

jobs:
  composed-smoke:
    name: actual-service-evidence-acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Chat Orchestrator
        uses: actions/checkout@v4
        with:
          path: chat-orchestrator
          fetch-depth: 0

      - name: Checkout Cognitive Runtime
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/cognitive-runtime
          ref: 20401b665e91ec4ffb1709f12b0fc175be5ff87b
          path: cognitive-runtime
          fetch-depth: 0

      - name: Checkout Data Source Aggregator
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/data-source-aggregator
          ref: 1fbe608477be9251419f5085162e4c5b7099afde
          path: data-source-aggregator
          fetch-depth: 0

      - name: Checkout Basic Memory Store
        uses: actions/checkout@v4
        with:
          repository: danielnguyen/basic-memory-store
          ref: 2ea5df0f598742992608198b800cfd1b8633bd6b
          path: basic-memory-store
          fetch-depth: 0

      - name: Establish pinned local main refs
        run: |
          git -C cognitive-runtime branch --force main 20401b665e91ec4ffb1709f12b0fc175be5ff87b
          git -C data-source-aggregator branch --force main 1fbe608477be9251419f5085162e4c5b7099afde
          git -C basic-memory-store branch --force main 2ea5df0f598742992608198b800cfd1b8633bd6b
          git -C chat-orchestrator merge-base --is-ancestor 22c327966c32da733391e5490b8d422ebbee9288 HEAD

      - name: Validate Compose configuration
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_TMP: /tmp/chat-orchestrator-composed-config
        run: docker compose -f docker-compose.composed-smoke.yml config >/dev/null

      - name: Build Chat Orchestrator image
        working-directory: chat-orchestrator
        run: docker build -f api/Dockerfile -t chat-orchestrator:history-root-lineage-v2-test api

      - name: Run Chat Orchestrator tests
        working-directory: chat-orchestrator
        run: >-
          docker run --rm
          --mount type=bind,source="$PWD/scripts",target=/scripts,readonly
          chat-orchestrator:history-root-lineage-v2-test python -m pytest -q

      - name: Run focused actual-service evidence proof
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          EVIDENCE_ACQUISITION_ONLY: "1"
          EVIDENCE_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_scenario || 'all' }}
        run: make composed-smoke

      - name: Run formatted presentation persistence proof
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          EVIDENCE_ACQUISITION_ONLY: "1"
          EVIDENCE_SCENARIO: general-reasoning-presentation
          COMPOSED_GENERAL_EVIDENCE_REASONING_ENABLED: "true"
          COMPOSED_GENERAL_EVIDENCE_REASONING_PRESENTATION_ENABLED: "true"
        run: make composed-smoke

      - name: Run policy-admitted advisory evidence proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          EVIDENCE_ADVISORY_ONLY: "1"
        run: make composed-smoke

      - name: Run server-owned immediate-history proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          HISTORY_FOLLOWUP_ONLY: "1"
        run: make composed-smoke

      - name: Run distinct-client owner-memory proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          DISTINCT_CLIENT_MEMORY_ONLY: "1"
        run: make composed-smoke

      - name: Run runtime admission composition proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          RUNTIME_ADMISSION_COMPOSITION_ONLY: "1"
        run: make composed-smoke

      - name: Run omitted conversation continuation proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          OMITTED_CONTINUATION_ONLY: "1"
        run: make composed-smoke

      - name: Run situated presence composition proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          SITUATED_PRESENCE_ONLY: "1"
          COMPOSED_RESTRAINT_ENABLED: "true"
        run: make composed-smoke

      - name: Run conversation retirement composition proof
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
          RETIREMENT_ONLY: "1"
        run: make composed-smoke

      - name: Run complete composed smoke regression
        if: github.event_name != 'workflow_dispatch' || inputs.evidence_scenario == 'all'
        working-directory: chat-orchestrator
        env:
          COMPOSED_SMOKE_LOG_DIR: /tmp/chat-orchestrator-bounded-logs
        run: make composed-smoke

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-composed-smoke-diagnostics
          path: /tmp/chat-orchestrator-bounded-logs
          if-no-files-found: ignore
          retention-days: 3
